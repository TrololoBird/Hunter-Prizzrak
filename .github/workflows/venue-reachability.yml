# Достижимость публичных API площадок С РАННЕРА GitHub — замер, а не предположение.
#
# ЗАЧЕМ. Директива владельца (CLAUDE.md, 2026-07-25): проверять только на живых данных.
# Логичный следующий шаг — гонять `scripts/verify_*.py` по расписанию в Actions. Но у этого
# плана есть предпосылка, которую нельзя принимать на веру: раннеры GitHub стоят в дата-центрах
# Azure, преимущественно в США, а Binance по регламенту отдаёт оттуда HTTP 451 (Unavailable For
# Legal Reasons). Если так — расписание построит ЗЕЛЁНЫЙ конвейер, который ничего не проверяет,
# либо красный, который никто не сможет починить. Это ровно тот класс «тихой деградации»,
# который проект запрещает.
#
# Поэтому сначала ФАКТ: этот воркфлоу ходит по одному дешёвому публичному эндпоинту каждой
# площадки и печатает HTTP-код + регион раннера. Никаких ключей, никаких приватных вызовов.
#
# ═══ РЕЗУЛЬТАТ ПЕРВОГО ЗАМЕРА — 2026-08-01, run 30676976401 ═══════════════════════════
# Раннер: Washington, Virginia, US — AS8075 Microsoft Corporation.
#
#   binance-usdm/ping            451   "Service unavailable from a restricted location"
#   binance-usdm/exchangeInfo    451   то же
#   binance-spot/ping            451   то же
#   binance-data/oiHist          451   то же
#   bybit/time                   403   CloudFront блокирует страну
#   okx/time                     200
#   bitget/time                  200
#   coingecko/ping               200
#   cryptocom/instruments        200
#
# ВЫВОД: гонять `scripts/verify_*.py` по расписанию в GitHub Actions НЕЛЬЗЯ. Первичная
# венью, на которой стоит весь движок, из облака GitHub недоступна вообще — а верификатор,
# который не может дойти до Binance, либо падает, либо (хуже) пропускает символы молча и
# рапортует успех. Живая проверка обязана идти С МАШИНЫ ВЛАДЕЛЬЦА: там она и запускается,
# см. `scripts/setup-windows-admin.bat` (задача планировщика Windows).
#
# ⚠ Цифры продублированы здесь НАМЕРЕННО: логи прогонов GitHub живут 90 дней, а вывод,
# на котором держится решение, должен пережить их. Проба остаётся в дереве не как гард,
# а как датчик: геоблок — политика площадки, она меняется без анонса.
name: venue-reachability

on:
  workflow_dispatch:
  # ⚠ `workflow_dispatch` дёргается ТОЛЬКО с ветки по умолчанию — то есть до мержа замер
  # этим триггером не получить, а мержить конвейер, который нельзя проверить, нельзя.
  # Отсюда триггер на PR с фильтром по пути: правка самой пробы её же и запускает.
  # Фильтр обязателен — без него проба висела бы на каждом PR проекта без причины.
  pull_request:
    paths:
      - ".github/workflows/venue-reachability.yml"
  # Раз в неделю: геоблок — это политика площадки, она меняется без анонса, и узнать об
  # изменении хочется до того, как на нём будет построен конвейер.
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner geography
        run: |
          echo "::group::runner location"
          curl -sS --max-time 10 https://ipinfo.io/json || echo "ipinfo unavailable"
          echo
          echo "::endgroup::"

      - name: Public endpoint probe
        run: |
          set -u
          probe() {
            name="$1"; url="$2"
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 15 "$url" || echo "000")
            head=$(head -c 160 /tmp/body.txt | tr -d '\n')
            printf '%-28s %s  %s\n' "$name" "$code" "$head"
          }
          echo "endpoint                     code  body(first 160b)"
          echo "-------------------------------------------------------------"
          probe "binance-usdm/ping"      "https://fapi.binance.com/fapi/v1/ping"
          probe "binance-usdm/exchInfo"  "https://fapi.binance.com/fapi/v1/exchangeInfo"
          probe "binance-spot/ping"      "https://api.binance.com/api/v3/ping"
          probe "binance-data/oiHist"    "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=5m&limit=1"
          probe "okx/time"               "https://www.okx.com/api/v5/public/time"
          probe "bybit/time"             "https://api.bybit.com/v5/market/time"
          probe "bitget/time"            "https://api.bitget.com/api/v2/public/time"
          probe "coingecko/ping"         "https://api.coingecko.com/api/v3/ping"
          probe "cryptocom/instruments"  "https://api.crypto.com/exchange/v1/public/get-instruments"
