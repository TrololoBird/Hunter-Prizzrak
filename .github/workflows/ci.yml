name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ⚠ РАСПИСАНИЕ — не косметика. Без него CI видит только моменты коммитов, а этот проект
  # ломается СНАРУЖИ: `pip-audit` ниже проверяет зафиксированный в uv.lock набор, и CVE,
  # опубликованная завтра в НЕИЗМЕНИВШЕЙСЯ зависимости, осталась бы невидимой до следующей
  # правки кода. Так же молча протухает базовый образ и выпадают yanked-релизы с PyPI.
  # Понедельник 05:23 UTC: смещено от :00, где очередь GitHub длиннее всего.
  schedule:
    - cron: "23 5 * * 1"
  # Ручной запуск — чтобы канарейку можно было дёрнуть, не делая пустой коммит.
  workflow_dispatch:

# Токен по умолчанию — только чтение. Джоб ничего не пишет в репозиторий; без этого блока
# права берутся из настроек репозитория, то есть шире необходимого.
permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон: очередь не копится, а на `main`
# отмена запрещена, чтобы история статусов защищённой ветки не зияла дырами.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      # ⚠ ИМЕННО `uv sync --locked`, а НЕ `uv venv` + `uv pip install -e ".[dev]"`.
      # Прежняя пара команд ИГНОРИРОВАЛА uv.lock: `uv pip install` — это pip-совместимый
      # интерфейс, он резолвит зависимости заново по потолкам из pyproject и лок-файл не
      # читает. Результат, измеренный 2026-07-27: в uv.lock лежала ruff 0.15.22, CI ставил
      # 0.16.0 (потолка у `ruff>=0.15` не было) и падал с 464 ошибками новых правил —
      # **14 коммитов подряд красные**, ни один из которых этих ошибок не вносил.
      # `--locked` вдобавок ПАДАЕТ, если uv.lock разошёлся с pyproject.toml, то есть ловит
      # забытый `uv lock` вместо того, чтобы тихо резолвить мимо него.
      # `--all-extras` покрывает [project.optional-dependencies]; группы из
      # [dependency-groups] (vulture, pre-commit, setuptools) uv sync ставит по умолчанию.
      - name: Install project (locked, all extras + dependency-groups)
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Vulture (dead-code guard, conf 80 + whitelist)
        run: uv run --no-sync vulture

      - name: Prohibited private CCXT API call scan
        run: uv run --no-sync python scripts/check_prohibited_apis.py

      - name: mypy (blocking — backlog cleared, 0 issues)
        run: uv run --no-sync mypy hunt_core

      # Уязвимости в зависимостях. Поймал PYSEC-2026-3447 (setuptools 82.0.1) за 4 секунды
      # на первом же прогоне 2026-07-26 — до этого гейта в пайплайне не было.
      # Сам пакет не опубликован на PyPI, поэтому --skip-editable.
      - name: pip-audit (known CVEs in dependencies)
        run: uv run --with pip-audit pip-audit --progress-spinner off --skip-editable

      # ⚠ pytest УДАЛЁН вместе с каталогом `tests/` (2026-07-27, решение владельца).
      #
      # Основание — замер, а не вкус. За один день проверка примитивов на живых данных нашла:
      # сдвиг локальных часов на 43.4 с (форминг-бар отдавался как закрытый 72% времени),
      # NATR и Aroon ровно в 100 раз, недостижимую полосу у book_imbalance_1pct, отравленный
      # леджер. Через все эти дефекты **903 теста прошли зелёными**.
      #
      # Хуже, часть тестов дефекты ЗАЩИЩАЛА: `test_prizrak_step0_render` требовал буквальный
      # текст `= "in_entry_zone"` ровно дважды, то есть закреплял утверждение вместо проверки;
      # `test_indicator_reference_values` пинил `adx[0] == 0.0` с комментарием «never null».
      # А контаминация леджера на 3423 строки (86% суммы pnl) была ВЫЗВАНА тестами, писавшими
      # в боевой файл через дефолт `close_signal(archive=True)`.
      #
      # Проект целиком сгенерирован ИИ и находится в активной разработке: сгенерированный ИИ
      # тест здесь фиксирует не требование, а текущую реализацию — и потому мешает её менять.
      # Проверка перенесена на живые данные (`scripts/verify_*.py`, `measure_*.py`,
      # `score_vs_razbor.py`) и прогон бота с разбором логов.
      - name: структурные инварианты (граница модулей + достижимость)
        run: uv run --no-sync python scripts/check_structure.py
