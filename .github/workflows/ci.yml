name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Create virtual environment
        run: uv venv

      - name: Install project (with dev extras)
        run: uv pip install --python .venv -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Vulture (dead-code guard, conf 80 + whitelist)
        run: uv run vulture

      - name: Prohibited private CCXT API call scan
        run: uv run python scripts/check_prohibited_apis.py

      - name: mypy (blocking — backlog cleared, 0 issues)
        run: uv run mypy hunt_core

      # Уязвимости в зависимостях. Поймал PYSEC-2026-3447 (setuptools 82.0.1) за 4 секунды
      # на первом же прогоне 2026-07-26 — до этого гейта в пайплайне не было.
      # Сам пакет не опубликован на PyPI, поэтому --skip-editable.
      - name: pip-audit (known CVEs in dependencies)
        run: uv run --with pip-audit pip-audit --progress-spinner off --skip-editable

      # Порог = ИЗМЕРЕННОЕ покрытие на 2026-07-26 (45%), а не желаемое. Смысл гейта —
      # ловить деградацию, а не требовать рывка. Поднимать вместе с реальным ростом.
      - name: pytest (+ coverage floor)
        run: uv run --with pytest-cov pytest -q --cov=hunt_core --cov-report=term --cov-fail-under=45
