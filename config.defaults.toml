# Hunt Watch — пороги. ТОЛЬКО ключи, у которых есть читатель.
#
# 2026-07-26: 63 из 158 ключей (40%) не доходили ни до одного читателя — правка была молчаливым
# no-op. Инертные секции вынесены в docs/config-intended.md. Здесь остаётся только то, что
# действительно управляет поведением; закреплено tests/test_config_keys_wired.py.

# Единственный источник порогов. config.toml мёржит поверх него только
# [bot]/[bot.network] (см. load_settings() в hunt_core/domain/config.py) —
# любые другие секции в config.toml не читаются.

# Секция [hunter] снята 2026-07-31 вместе с модулем МАНИПУЛЯЦИИ: это была конфигурация
# воронки вселенной сканера (пороги ликвидности, score_watch/priority, watchlist_limit,
# scan_interval_s). Её единственный читатель `params/store.py::hunter_thresholds()` остался
# без вызывающих после выреза и удалён — по правилу шапки «ТОЛЬКО ключи, у которых есть
# читатель» секция обязана была уйти следом.

[confirm.short]
# REPORTING ONLY — /signals gaps, stats cards (gate/_report.py). Does NOT set setup.confirmed.
# Production confirm authority = fusion gate_open → setup.confirmed (see docs/AUTHORITY_MODEL.md).
min_score = 60
min_score_without_div = 68
forming_min_score = 45

[pinned.defaults]
# Canonical 7-coin anchor set (operator decision 2026-06-21). Metals (XAU/XAG) and
# PAXG carry thin 1w history → higher-TF panel degrades gracefully (documented, not a bug).
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "XAUUSDT", "XAGUSDT", "PAXGUSDT"]
modes = { BTCUSDT = "both", ETHUSDT = "both", SOLUSDT = "both", XRPUSDT = "both", XAUUSDT = "both", XAGUSDT = "both", PAXGUSDT = "both" }
deep_continuous = true
hunt_confirm = false
# Deep /signal uses HUNT_FULL_PREPARE=1 + microstructure for these anchors.
analyst = { BTCUSDT = true, ETHUSDT = true, SOLUSDT = true, XRPUSDT = true, XAUUSDT = true, XAGUSDT = true, PAXGUSDT = true }

[analyst.pinned]
interval_s = 300
tg_on_change = true
tg_stale_hours = 4

[analyst]
enabled = true
signal_queue_enabled = true
signal_queue_top_n = 3
signal_queue_tg_footer = true
signal_queue_tg_batch = true
signal_queue_tg_min_rank = 2
signal_queue_ttl_hours = 2.5

[tracker]
# Auto-close active signals with no successful reconcile longer than this (orphan path).
orphan_ttl_hours = 24
stale_lc_ticks_default = 3
stale_lc_ticks_near_tp1 = 8
near_tp1_remaining_pct = 3.0
reclaim_buffer = 1.001
breakeven_buffer_pct = 0.15
breakeven_buffer_min_pct = 1.0
breakeven_risk_fraction = 0.25
# Defer trailing until MFE proves the move (APT 2026-07-05: 3.49% MFE → stop_hit без трейлинга).
min_trail_mfe_pct = 2.5
early_breakeven_mfe_pct = 99.0
early_breakeven_buffer_pct = 0.12
dump_active_early_be_mfe_pct = 99.0
dump_initiating_early_be_mfe_pct = 99.0
exhaustion_early_be_mfe_pct = 99.0
accumulation_early_be_mfe_pct = 99.0
distribution_early_be_mfe_pct = 99.0
tp1_partial_fix_pct_normal = 50.0
tp1_partial_fix_pct_hot = 80.0
# After TP1: breakeven buffer as ATR(1h)% × this fraction (fallback: breakeven_buffer_pct).
tp1_breakeven_atr_fraction = 0.25

# ⚠ Опубликованы 2026-07-26 по свипу фантомных ручек. Все четыре ЧИТАЛИСЬ кодом через
# `tracker_thresholds()`, но не были записаны НИГДЕ — ни здесь, ни в `UNIVERSAL_DEFAULTS`, ни в
# несуществующем `data/hunt_calibration.json`. То есть выглядели настройкой, а правке не
# поддавались: всегда побеждал инлайн-дефолт из `.get(key, <literal>)`. Значения равны этим
# инлайн-дефолтам — публикация тождественна по поведению, менять числа только по замеру (I-7).
# Шаг трейла = ATR(1h)% × fraction (`track/_trailing.py`; раньше падал на breakeven_risk_fraction).
atr_trail_risk_fraction = 0.25
# Минимальный «храповик» трейла, доля ATR(1h)% — меньше него стоп не двигаем (`track/_trailing.py`).
trail_min_atr_move = 0.15
# Q13 chop-гард: при ADX(1h) ниже этого прибыльный сигнал НЕ закрывается по флипу биаса
# (`track/_followups.py`) — решает, объявить ли инвалидацию по открытой позиции.
bias_flip_chop_adx_max = 20.0
# Снайперский выход держит позицию, если MFE уже не ниже этого (`track/_evaluate_levels.py`).
sniper_hold_min_mfe_pct = 2.0

# Detection thresholds removed — self-calibration lives in hunt_core/detect/calibrate.py
# and [fusion] below. Feature flags for collect/scoring fuel are in params/store.py.

[maps]
enabled = true
multi_exchange = true
# ⚠️ n_buckets / price_range_pct относятся к СТАКАНУ, а не к карте ликвидаций. У карты
# ликвидаций свои ключи, и они читаются загрузчиком (maps/config.py:134-137), но до сих пор не
# были здесь выписаны — читатель видел price_range_pct = 5.0 и считал, что это её окно. Аудит окон
# 2026-07-26 (docs/audit/windows-2026-07-26.md) назвал это конфиг-дрейфом: ключ существует,
# работает, но о нём нельзя узнать из TOML.
n_buckets = 20
price_range_pct = 5.0
# Карта ликвидаций — СВОИ окно и разрешение (шире стакана: каскады уходят дальше книги).
liq_price_range_pct = 12.0
liq_n_buckets = 48
# Показатель склонности к плечу в синтетической (leverage-tier) полосе.
liq_leverage_propensity_exp = 1.0
# Порог расхождения CVD с ценой (footprint-дивергенция).
cvd_div_ratio = 0.15
# ⚠️ Окно карты ликвидаций И футпринта/CVD. Реальное окно футпринта = min(этого, глубины кэша
# сделок ccxt в 1000 штук): замер 2026-07-26 — BTC 218 с, ETH 308 с, то есть на мажорах оно
# упирается в кэш и ПЛАВАЕТ с активностью. Тепловая карта покрывает ровно эти 300 с и между
# тиками не накапливается.
window_seconds = 300
retention_samples = 120
max_symbols = 48
book_top_n = 5
book_deep_top_n = 50
book_sample_interval_s = 5.0
sticky_min_samples = 3
void_depth_pctile = 10.0
forward_blend_ratio = 0.35
forward_confidence_min = 0.25
# One weight per tier in liquidation._DEFAULT_LEVERAGE_TIERS (10,25,50,100) — MUST be
# 4 elements. The 5-element form was stale (5th weight dead) and shifted the
# mass-weighted leverage anchor to 55.6× vs the intended ~61.7× (Cheng ~60×).
leverage_weights = [0.35, 0.30, 0.20, 0.15]
vp_periods = ["1h", "4h", "1d", "1w"]
# 60 (not 24): trader-grade POC/VAH/VAL resolution — 24 buckets is ~$150/bucket on
# BTC, too coarse to place a usable level (matches maps/config.py code intent).
vp_buckets = 60

# HVN/LVN node sensitivity + per-period lookback (were hardcoded in volume_profile.py).
# Moved value-for-value; pinned by tests/test_vp_config_knobs.py.
vp_hvn_ratio = 1.3
vp_lvn_ratio = 0.5
vp_lookback_4h = 42
vp_lookback_1d = 30
vp_lookback_1w = 12

# --- Orderbook detector thresholds (were hardcoded in maps/orderbook.py) -------------
# Moved here value-for-value; pinned by tests/test_ob_detector_calibration.py so a typo
# cannot silently retune a detector. KNOWN LIMITATION: the absorption/spoof floors are
# ABSOLUTE USD, so they do not scale across symbols — mute on a thin alt, noisy on a
# major. Making them relative is a calibration decision, not a config move.
sticky_tolerance_pct = 0.15
iceberg_tolerance_pct = 0.08
iceberg_min_fill_ratio = 1.4
iceberg_floor_frac = 0.02
iceberg_ratio_cap = 50.0
absorption_min_notional_usd = 25000.0
absorption_min_delta_usd = 10000.0
absorption_near_bin_pct = 0.35
absorption_max_distance_pct = 1.5
spoof_tolerance_pct = 0.12
spoof_min_wall_usd = 50000.0
spoof_max_distance_pct = 1.2
spoof_vanish_frac = 0.25
voids_top_n = 5
vp_value_area_pct = 0.70

