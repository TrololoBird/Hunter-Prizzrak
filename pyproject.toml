[build-system]
# Пол 83: setuptools 82.0.1 несёт PYSEC-2026-3447, исправлено в 83.0.0 (замер pip-audit
# 2026-07-26). Не опускать — проверяется гейтом `pip-audit` в CI.
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-hunter"
version = "1.0.0"
description = "Standalone crypto futures hunter — Binance USDⓈ-M public data via ccxt(pro), Polars feature engine."
readme = "README.md"
# Standalone build: Python 3.14.5 (not 3.14t).
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Crypto Signal Bot" }]
dependencies = [
    "orjson>=3.10",
    "python-dotenv>=1.2.2",
    # Polars-plugin floors. These plugins drift APIs without semver discipline
    # (precedent: polars_ols went to positional `features` args + mode="coefficients";
    # ccxt fstream split) — do NOT lower the floors. Проверка после бампа —
    # `scripts/verify_talib_parity.py` на ЖИВЫХ кадрах; прежняя редакция этого
    # комментария ссылалась на tests/test_indicator_reference_values.py и «500+ тестов»,
    # а каталог tests/ удалён 2026-07-27 (см. CLAUDE.md).
    "polars>=1.42.1",
    "polars-ols>=0.3.5",   # compute_(rolling_)least_squares positional exprs, mode=, RollingKwargs(null_policy=)
    "polars_ta>=0.5.17",   # ТОЛЬКО .tdx/.wq — сурфейсы без канонического аналога в TA-Lib (KDJ/PSY/BIAS/EMV/DPO/BOLL, ts_rank/ts_delta/ts_corr)
    # polars-talib = ВЕНДОРЕННАЯ TA-Lib 0.4.0, битовая совместимость, внешняя C-библиотека
    # НЕ нужна, зависит только от polars (ни pandas, ни numpy — проверено установкой).
    # Причина появления: polars_ta НАМЕРЕННО переосмысляет TA-Lib, и каждая ручная заплатка
    # в features/polars_ta_bridge.py компенсировала это расхождение. Замер 2026-07-27 на
    # 27 живых кадрах: ADX расходился на 100% баров (max |Δ| 85.8), Aroon на 20-22%
    # (инверсия до 100 пунктов), RSI до 28.3 пункта на дешёвых монетах.
    # Разбор: docs/audit/talib-parity-2026-07-27.md
    "polars-talib>=0.1.6",
    "polars-ds>=0.12.0",   # query_entropy / ks_2samp exprs used by features/research_plugins.py
    "numpy>=2.4.6,<2.5",  # ceiling: numba (transitive via polars-ta) requires numpy<2.5 on py3.14; 2.5 forces a numba/llvmlite downgrade that fails to build
    "aiohttp>=3.13.5,<4",
    "aiohttp-socks>=0.10.1",
    "python-socks[asyncio]>=2.7.1",
    "aiogram>=3.28.2,!=3.29.0",  # 3.29.0 yanked: severe slowdown parsing nested RichBlock entities
    "tenacity>=9.1.4",
    "structlog>=25.5.0",
    "pydantic>=2.13.4,<2.14",
    # Hard floor 4.5.44: older ccxt silently loses kline/markPrice/forceOrder WS
    # after Binance's 2026-04-23 fstream split (docs/HUNTER_TARGET_SPEC.md).
    "ccxt>=4.5.44",
    "prometheus-client>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"
Repository = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"

[project.optional-dependencies]
# ⚠ pytest/pytest-asyncio/hypothesis УДАЛЕНЫ вместе с каталогом `tests/` (2026-07-27).
# Проверка перенесена на живые данные: `scripts/verify_*.py`, `measure_*.py`,
# `score_vs_razbor.py` и прогон бота с разбором логов. Структурные инварианты (граница
# модулей, достижимость от точки входа) — `scripts/check_structure.py`.
# ⚠ ЛИНТЕРЫ ПИНЯТСЯ ПО ПОТОЛОК, И ЭТО НЕ ПЕДАНТИЗМ. Открытый пол `ruff>=0.15` означал, что
# CI ставит САМУЮ СВЕЖУЮ ruff, а её набор правил меняется между минорными версиями. Итог,
# измеренный 2026-07-27: локально стояла 0.15.22 и `ruff check .` был зелёным, CI ставил
# 0.16.0 и падал с **464 ошибками** — при полностью идентичном коде. Красными оказались
# **14 коммитов подряд** за сутки с лишним, ни один из которых этих ошибок не вносил.
#
# Гейт, который меняет вердикт без изменения кода, гейтом не является: он приучает
# игнорировать красный CI, и настоящая поломка проходит незамеченной.
#
# Бэклог 0.16 — отдельная измеренная задача, а не повод держать CI красным. Состав:
# 110 I001 (unsorted-imports), 79 BLE001 (blind-except), 42 RUF022, 25 RUF100, далее хвост.
# Большая часть автофиксится, но BLE001/S110/S112 трогают обработку исключений — это правка
# поведения, её нельзя делать заодно.
# Поднимать потолок — отдельным коммитом, вместе с разбором находок новой версии.
dev = ["ruff>=0.15.22,<0.16", "mypy>=2.3.0,<2.4"]
diagnostics = ["rich>=13.0"]
monitoring = ["prometheus-client>=0.25", "prometheus-async>=26.0"]
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hunt_core*"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".git", ".venv", "_archive", "build", "dist", ".vulture_whitelist.py"]
# Honour `exclude` even when a path is passed explicitly (pre-commit passes files by
# name, which would otherwise bypass the exclude and lint .vulture_whitelist.py).
force-exclude = true

[tool.ruff.lint]
# Hunt uses lazy imports and scan split globals().update() facades.
ignore = ["E402", "E741"]
# TID251 (banned-api) mechanically enforces the "no pandas / no requests" rule that
# previously lived only as prose in the AI instructions (docs/ai/rules/prohibited-apis.md).
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "No pandas — use the Polars Expression API / LazyFrame. See docs/ai/rules/prohibited-apis.md."
"pandas.DataFrame".msg = "No pandas — use polars.DataFrame / LazyFrame. See docs/ai/rules/prohibited-apis.md."
"requests".msg = "No requests — the stack is fully async; use aiohttp. See docs/ai/rules/prohibited-apis.md."

[tool.ruff.lint.per-file-ignores]
# Только для СУЩЕСТВУЮЩИХ файлов. Удалено 2026-07-26 как мёртвое: runtime/_impl.py
# (нет такого пути — есть runtime/cycle/_impl.py), market/streams.py и runtime/cycle.py
# (снесены 5ba0fea вместе с легаси-транспортом). Исключение для несуществующего файла
# не безобидно: когда путь возникнет заново, он молча получит поблажку.
"hunt_core/domain/schemas.py" = ["E402"]
"hunt_core/data_readiness.py" = ["F841"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["_archive", "build", "dist"]
# `[[overrides]] module=["hunt_core.toolkit.*"] ignore_errors=true` снят 2026-07-26:
# замер показал 0 ошибок на всех 12 файлах toolkit/ — исключение выводило 1863 строки
# из-под проверки, ничего при этом не подавляя, и делало «mypy clean» слабее, чем звучит.

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "vulture>=2.16",
    # PYSEC-2026-3447 живёт в setuptools 82.0.1, чинится в 83.0.0. Пол в `[build-system].requires`
    # его НЕ закрывает: тот раздел описывает изолированное окружение СБОРКИ, а pip-audit проверяет
    # то, что стоит в venv. Замер 2026-07-26: после правки build-system в venv по-прежнему был
    # 82.0.1, и добавленный в CI гейт pip-audit падал. Пол нужен именно здесь.
    "setuptools>=83",
]

[tool.vulture]
# Dead-code guard (the project's I-6 defect class). min_confidence=80 keeps it
# signal-only (conf 60 = 396 mostly-false hits); .vulture_whitelist.py suppresses
# the reviewed intentional cases (signature-contract params).
min_confidence = 80
paths = ["hunt_core", ".vulture_whitelist.py"]
