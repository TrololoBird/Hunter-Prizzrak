# ast-grep — структурный поиск по AST под инварианты этого проекта.
#
# Зачем, если есть ruff и rg: ruff проверяет то, для чего у него есть правило, а rg ищет ТЕКСТ.
# Классы дефектов здесь (I-5 lookahead, I-6 fail-loud) — про ФОРМУ выражения, а не про текст:
# `x or 0.0` надо отличать от `x or []`, а `df[-2]` от `df[-2:]`. Это и есть AST.
#
# ⚠ ПОВЕРКА ПРИБОРА ОБЯЗАТЕЛЬНА — замер 2026-08-02 показал, почему.
# Инлайн-паттерн `def $F($$$A): $$$B` дал 0 совпадений при 139 `async def` по rg, а по всему
# дереву покрыл 4 файла из 199 — то есть МОЛЧА недоматчил блочные определения и выдал бы
# «нарушений не найдено» на пустом охвате. Поиск по AST-виду (`-k function_definition`) дал
# 1631 против ровно 1631 у `rg -c "^\s*(async )?def "` — совпадение точное, 175 файлов.
# Вывод: перед тем, как верить счётчику, сверь его с независимым контролем на заведомом ответе.
#
# Прогон:
#   ast-grep scan                       # все правила ниже
#   ast-grep scan -r <rule-id>          # одно правило
#   ast-grep run -p '$A or 0.0' --lang python hunt_core    # разовый поиск
ruleDirs:
  - .ast-grep/rules
