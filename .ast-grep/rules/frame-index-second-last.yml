id: frame-index-second-last
language: python
severity: warning
message: >-
  Индекс `[-2]` по кадру — маркер РЕГРЕССИИ инварианта I-5, а не его соблюдения.
note: |
  Кадры здесь closed-only ПОСЛЕ финализации, поэтому `-1` И ЕСТЬ свежайший ЗАКРЫТЫЙ бар.
  «Починка» на `-2` ради защиты от lookahead отдаёт ПРОТУХШИЙ бар — эта регрессия уже
  приезжала в прод. Каждое срабатывание требует ответа: этот кадр финализирован или сырой?
  Смотреть на продюсера кадра, а не на имя переменной.
rule:
  any:
    - pattern: $X[-2]
    - pattern: $X[$Y - 2]
files:
  - "hunt_core/**/*.py"
