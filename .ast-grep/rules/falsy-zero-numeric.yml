id: falsy-zero-numeric
language: python
severity: warning
message: >-
  `or` с числовым дефолтом: если левая часть законно бывает 0/0.0, дефолт подменит ИЗМЕРЕННЫЙ
  ноль выдуманным числом. Это инвариант I-6 (fail-loud), фирменный класс дефектов проекта.
note: |
  Кандидат, не приговор. Подтверждается только ответом на вопрос: может ли левая часть быть
  валидным нулём? Если да — правка не «поменять дефолт», а пропустить None/not_ready наверх.
  Замер 2026-08-02 по hunt_core: `or 0.0` — 58 мест, `or 1.0` — 6; контроль rg дал те же
  58 и 6, то есть охват правила полный.
rule:
  any:
    - pattern: $A or 0.0
    - pattern: $A or 1.0
    - pattern: $A or 0
    - pattern: $A or 1
files:
  - "hunt_core/**/*.py"
  - "scripts/**/*.py"
  - "analysis/**/*.py"
