id: silent-degradation-fallback
language: python
severity: error
message: >-
  Отсутствующие рыночные данные подменяются правдоподобным значением (`now()`, пустой
  контейнер, литерал) без записи о подмене. Прямое нарушение директивы владельца
  «молчаливые ошибки и деградации НЕ ДОПУСТИМЫ».
note: |
  Разрешено ровно одно: пронести None/not_ready наверх, ЛИБО деградировать ГРОМКО — строкой
  лога с причиной (образец: runtime/logging.py::_colors_supported — цвет выключается и
  печатает почему). `except: pass` уже закрыт правилами ruff S110/S112; здесь ловится то,
  что ruff не видит по построению — подстановка значения вместо отказа.
rule:
  any:
    - pattern: $A or datetime.now($$$)
    - pattern: $A or time.time()
    - pattern: $A if $A is not None else 0.0
# ⚠ Ограничение заведено ПОСЛЕ первого прогона, по его результату, а не заранее.
# Первая редакция дала 14 срабатываний, из них 13 — `now or datetime.now(UTC)`, то есть
# штатная идиома параметра `now: datetime | None = None` для детерминированного времени,
# а НЕ подмена рыночных данных. Правило без этого ограничения шумит 93%, и такой сигнал
# перестают читать. Осталось 3 кандидата: подмена ОТСУТСТВУЮЩЕЙ метки наблюдения текущим
# временем (это фабрикация свежести) и «неизвестно → 0.0».
constraints:
  A:
    not:
      regex: "^_?now$"
files:
  - "hunt_core/**/*.py"
