id: dict-get-inline-default
language: python
severity: info
message: >-
  `.get(ключ, дефолт)` — кандидат в ФАНТОМНУЮ РУЧКУ: если ключ не пишется ни конфигом, ни
  продюсером, инлайн-дефолт побеждает всегда, и правка TOML молча ничего не меняет.
note: |
  Проверять не наличие ключа, а наличие ПИСАТЕЛЯ: `rg -n '"<ключ>"' config.defaults.toml
  config.toml hunt_core/`. Прецедент 2026-07-26: свип секции [tracker] дал 4 фантомные ручки
  (записать негде) и 2 ключа без читателя. Отличай «нет писателя» от «нет читателя» — второе
  чинится удалением функции, а не дефолта.
rule:
  pattern: $OBJ.get($KEY, $DEFAULT)
files:
  - "hunt_core/**/*.py"
